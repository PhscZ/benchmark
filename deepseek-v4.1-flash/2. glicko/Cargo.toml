[package]
name = "glicko-api"
version = "0.1.0"
edition = "2021"
description = "Glicko-2 rating REST API for kill-based game events"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
